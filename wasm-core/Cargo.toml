[package]
name = "wasm-core"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]
doctest = false

[profile.release]
# Bound delivery size; hot PDF loops use explicit inline hints.
opt-level = 2
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.test]
opt-level = 1

[dependencies]
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
dlmalloc = { version = "0.2.14", features = ["global"] }
