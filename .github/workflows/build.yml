name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup
        with:
          components: rustfmt

      - name: Check Rust formatting
        working-directory: wasm-core
        run: cargo fmt --check && cargo fmt --manifest-path ../wasm-fonts/Cargo.toml --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup
        with:
          components: clippy

      - name: Lint Rust
        working-directory: wasm-core
        run: |
          cargo clippy -- -A clippy::all -D clippy::correctness
          cargo clippy --manifest-path ../wasm-fonts/Cargo.toml --target wasm32-unknown-unknown -- -A clippy::all -D clippy::correctness

      - name: Check types
        run: bun run check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Rust tests
        run: bun run test:rust

      - name: Build wasm
        run: bun run wasm

      - name: Build site
        run: bun run build

      - name: Install PDF validation tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Web tests
        run: bun run test

  build:
    needs: [format, lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up build environment
        uses: ./.github/actions/setup

      - name: Build wasm
        run: bun run wasm

      - name: Build site
        run: bun run build

      - name: Upload site
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
